# Excubitor catalog 断片 — このリポ自身のサービス定義。
# 公開 Excubitor リポの services.yaml に private 定義 (infisical project_id 等) を
# 焼き込まないため、 各サービスの catalog エントリは自リポに置く。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する (Excubitor catalog/FRAGMENTS.md 参照)。
services:
  # ポートは catalog が払い出す。17591 は localhost sidecar の仮既定値で外部公開しない。
  - code: ostiarius-face-sidecar
    name: Ostiarius face inference sidecar
    tier: saas
    project_code: ostiarius
    component: face-sidecar
    port: 17591
    repo: LUDIARS/Ostiarius
    runtime: python
    cwd: ${ARS_ROOT}/Ostiarius/face-sidecar
    # 実機手順 (venv / fetch-models / pytest) は docs/E2E-identity.md §A-2。モデル置き場は FACE_SIDECAR_MODELS_DIR (既定 face-sidecar/models)。
    command: uvicorn face_sidecar.app:app --host 127.0.0.1 --port ${port}
    env:
      FACE_SIDECAR_MODELS_DIR: ${ARS_ROOT}/Ostiarius/face-sidecar/models
    autostart: false
    health:
      type: http
      url: http://127.0.0.1:17591/v1/health
      interval_sec: 30
  - code: ostiarius
    name: Ostiarius (Wi-Fi内出席ゲートウェイ)
    # LAN-only。Cloudflare Tunnel / public domain / subdomain は割り当てない。
    tier: saas
    project_code: ostiarius
    component: server
    port: 17590
    repo: LUDIARS/Ostiarius
    runtime: node
    cwd: ${ARS_ROOT}/Ostiarius
    command: npm run dev
    allow_hot_reload: true
    # face-sidecar は任意依存 (無くても起動し、/api/health の sidecar.ok=false で顔経路を fallback 表示)
    depends_on: [cernere]
    autostart: false
    env:
      OSTIARIUS_PORT: "17590"
    # CERNERE_SERVICE_TOKEN は required_env に置かない。 Cernere の project token は TTL 60 分で、
    # 静的に置くと 1 時間で失効する。 起動ごとに注入される CERNERE_PROJECT_CLIENT_ID /
    # CERNERE_PROJECT_CLIENT_SECRET (下の cernere_launch_credentials 由来) から都度取り直す。
    required_env:
      - OSTIARIUS_LAN_ID
      - OSTIARIUS_FACILITY_ID
      - CERNERE_BASE_URL
      - OSTIARIUS_RP_ID
      - OSTIARIUS_PWA_ORIGIN
      # 本人確認ゲート (P1/P2): kiosk 共有トークンと顔テンプレート暗号鍵は起動必須 (config.ts requireEnv)
      - OSTIARIUS_KIOSK_TOKEN
      - OSTIARIUS_TEMPLATE_KEY
    infisical:
      project_id: 19c9e77d-646c-4a0e-a091-b494234953ea
      environment: dev
      inject: true
      # TLS_MODEは未設定時off。証明書3値と同時にrequiredをInfisicalへ投入して切り替える。
      include: [OSTIARIUS_LAN_ID, OSTIARIUS_FACILITY_ID, OSTIARIUS_RP_ID, OSTIARIUS_PWA_ORIGIN, OSTIARIUS_LABEL, OSTIARIUS_TLS_MODE, OSTIARIUS_LAN_HOSTNAME, OSTIARIUS_TLS_CERTIFICATE_PEM, OSTIARIUS_TLS_PRIVATE_KEY_PEM, OSTIARIUS_KIOSK_TOKEN, OSTIARIUS_TEMPLATE_KEY, AEDILIS_GATEWAY_TOKEN, CERNERE_SERVICE_TOKEN, CERNERE_FACE_PHOTO_TOKEN, OSTIARIUS_FACE_REVIEWER_USER_ID, CERNERE_FRONTEND_URL, OSTIARIUS_FACE_SIDECAR_URL, OSTIARIUS_FACE_MATCH_THRESHOLD, OSTIARIUS_FACE_MARGIN, OSTIARIUS_LIVENESS_THRESHOLD, OSTIARIUS_FACE_CHALLENGE, OSTIARIUS_FACE_TEMPLATE_SOURCE, OSTIARIUS_STAFF_ROLES]
    requires_secret:
      - service: cernere
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    cernere_launch_credentials:
      target_project: ostiarius
    health:
      type: http
      url: http://localhost:17590/api/health
      interval_sec: 30
    provides:
      OSTIARIUS_URL: http://${host}:${port}
      OSTIARIUS_BASE_URL: http://${host}:${port}
